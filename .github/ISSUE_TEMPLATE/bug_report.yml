name: Bug report
description: Something does not work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please do not paste raw router output or unredacted logs: they contain MAC addresses,
        IP addresses and device names. Download the integration's diagnostics instead
        (Settings, Devices & services, Synology SRM Router, the three dots, Download
        diagnostics); they contain no addresses or names.
  - type: input
    id: version
    attributes:
      label: Integration version
    validations:
      required: true
  - type: input
    id: ha
    attributes:
      label: Home Assistant version
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Router or access point model and SRM version
      placeholder: "RT2600ac, SRM 1.3.2-9366 Update 3"
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Setup
      options:
        - "router only"
        - "router with standalone access points"
        - "router with mesh points"
        - "standalone access point behind another router"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Paste the downloaded diagnostics; read them before posting.
      render: json
