name: Release

# A pushed tag vX.Y.Z runs the checks, packs the integration into a zip with build provenance
# (`gh attestation verify`) and creates the GitHub release: its notes are the version's section
# of CHANGELOG.md and the zip's SHA-256. HACS offers each GitHub release; the zip is for manual
# installs.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  release:
    name: GitHub release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write # the release
      id-token: write # the provenance signature
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Release only commits that are on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$TAG is not on main"; exit 1; }
      - name: Check the version and write the notes
        env:
          TAG: ${{ github.ref_name }}
        run: python3 scripts/release_notes.py "$TAG" > notes.md
      - name: Pack the integration
        run: |
          git archive --format=zip -o synology_srm_router.zip "$GITHUB_SHA:custom_components/synology_srm_router"
          sum=$(sha256sum synology_srm_router.zip | cut -d' ' -f1)
          # The hash in a block of its own: it scrolls on narrow screens, where inline code is cut off.
          printf '\n**Manual install:** %s, SHA-256:\n\n%s\n%s\n%s\n' "\`synology_srm_router.zip\`" "\`\`\`text" "$sum" "\`\`\`" >> notes.md
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: synology_srm_router.zip
      # A re-run of a failed job updates the release instead of failing on it.
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            gh release upload "$TAG" synology_srm_router.zip --repo "$REPO" --clobber
            gh release edit "$TAG" --repo "$REPO" --notes-file notes.md
          else
            gh release create "$TAG" synology_srm_router.zip --repo "$REPO" --title "$TAG" \
              --notes-file notes.md --verify-tag
          fi
