# Example dashboard for Synology SRM Router: Settings, Dashboards, Add dashboard, "New dashboard
# from scratch", then the three dots, Raw configuration editor, and paste this. Replace rt2600ac
# and mr2200ac with your devices' entity ID prefixes (the model names, lower case). Entity IDs
# follow Home Assistant's language at setup; in German, for example, cpu_load is cpu_last (see
# the table on the Dashboards page). The DHCP and firewall cards need the sensors DHCP leases,
# DHCP reservations and Firewall rules enabled.
views:
  - title: Network
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Router
            icon: mdi:router-wireless
          - type: gauge
            entity: sensor.rt2600ac_cpu_load
            name: CPU
            grid_options: {columns: 6}
          - type: gauge
            entity: sensor.rt2600ac_memory_usage
            name: Memory
            grid_options: {columns: 6}
          - type: tile
            entity: sensor.rt2600ac_clients
            grid_options: {columns: 6}
          - type: tile
            entity: sensor.rt2600ac_download_rate
            grid_options: {columns: 6}
          - type: tile
            entity: binary_sensor.rt2600ac_wan_connection
            name: Internet
            grid_options: {columns: 6}
          - type: tile
            entity: sensor.rt2600ac_public_ipv4_address
            grid_options: {columns: 6}
          - type: tile
            entity: sensor.rt2600ac_ipv6_prefix
            grid_options: {columns: 6}
          - type: statistics-graph
            title: Traffic
            entities:
              - sensor.rt2600ac_download_rate
              - sensor.rt2600ac_upload_rate
            days_to_show: 1
            period: hour
            stat_types: [mean]
            chart_type: line
      - type: grid
        cards:
          - type: heading
            heading: Access point
            icon: mdi:access-point
          - type: gauge
            entity: sensor.mr2200ac_cpu_load
            name: CPU
            grid_options: {columns: 6}
          - type: gauge
            entity: sensor.mr2200ac_memory_usage
            name: Memory
            grid_options: {columns: 6}
          - type: tile
            entity: sensor.mr2200ac_clients
            grid_options: {columns: 6}
          - type: tile
            entity: sensor.mr2200ac_download_rate
            grid_options: {columns: 6}
          - type: markdown
            title: By radio
            content: |
              {#- Names come from the devices themselves: escape what Markdown would read as a table, link or image. -#}
              {%- macro md(v) -%}{{ (v ~ '') | replace('\r', ' ') | replace('\n', ' ') | replace('\\', '\\\\') | replace('|', '\\|') | replace('[', '\\[') | replace(']', '\\]') | replace('!', '\\!') | replace('<', '&lt;') | replace('>', '&gt;') | replace('`', '\\`') | replace('*', '\\*') | replace('_', '\\_') }}{%- endmacro -%}
              {% set ts = states.device_tracker
                 | selectattr('state', 'eq', 'home')
                 | selectattr('attributes.radio', 'defined')
                 | selectattr('attributes.radio', 'ne', none)
                 | list %}
              {% for g in ts | groupby('attributes.radio') %}
              **{{ md(g.grouper) }}** ({{ g.list | count }})
              {% for s in g.list | sort(attribute='name') %}
              - {{ md(s.name) }} · {{ md(s.attributes.connected_to) }}, signal {{ s.attributes.signal }}
              {% endfor %}
              {% endfor %}
      - type: grid
        cards:
          - type: heading
            heading: Clients
            icon: mdi:devices
          - type: markdown
            title: Who is where
            content: |
              {#- Names come from the devices themselves: escape what Markdown would read as a table, link or image. -#}
              {%- macro md(v) -%}{{ (v ~ '') | replace('\r', ' ') | replace('\n', ' ') | replace('\\', '\\\\') | replace('|', '\\|') | replace('[', '\\[') | replace(']', '\\]') | replace('!', '\\!') | replace('<', '&lt;') | replace('>', '&gt;') | replace('`', '\\`') | replace('*', '\\*') | replace('_', '\\_') }}{%- endmacro -%}
              {% set ts = states.device_tracker
                 | selectattr('state', 'eq', 'home')
                 | selectattr('attributes.connected_to', 'defined')
                 | list %}
              {% for g in ts | groupby('attributes.connected_to') %}
              **{{ md(g.grouper) }}** ({{ g.list | count }})
              {% for s in g.list | sort(attribute='name') %}
              - [{{ md(s.name) }}](/history?entity_id={{ s.entity_id }}) · {{ md(s.attributes.connection) }}{% if s.attributes.radio %} {{ md(s.attributes.radio) }}, signal {{ s.attributes.signal }}{% endif %}
              {% endfor %}
              {% endfor %}
      - type: grid
        cards:
          - type: heading
            heading: DHCP
            icon: mdi:lan-connect
          - type: gauge
            entity: sensor.rt2600ac_dhcp_pool_usage_lan
            name: Pool LAN
            severity: {green: 0, yellow: 70, red: 90}
            grid_options: {columns: 6}
          - type: tile
            entity: sensor.rt2600ac_dhcp_leases
            name: Leases
            grid_options: {columns: 6}
          - type: markdown
            title: Unknown devices
            content: |
              {#- Names come from the devices themselves: escape what Markdown would read as a table, link or image. -#}
              {%- macro md(v) -%}{{ (v ~ '') | replace('\r', ' ') | replace('\n', ' ') | replace('\\', '\\\\') | replace('|', '\\|') | replace('[', '\\[') | replace(']', '\\]') | replace('!', '\\!') | replace('<', '&lt;') | replace('>', '&gt;') | replace('`', '\\`') | replace('*', '\\*') | replace('_', '\\_') }}{%- endmacro -%}
              {% set s = states.sensor | selectattr('entity_id', 'in', integration_entities('synology_srm_router'))
                 | selectattr('attributes.leases', 'defined') | first %}
              {% set rows = (s.attributes.leases if s else []) | selectattr('unknown') | list %}
              {% if rows %}
              Devices with an address but neither a reservation nor a name given in SRM:

              {% for r in rows -%}
              - {{ '●' if r.online else '○' }} **{{ md(r.name or 'no name') }}** · {{ md(r.ip) }} · `{{ md(r.mac) }}`
              {% endfor %}
              Give the ones you know a name in SRM; the rest are worth a look.
              {% else %}
              Every device with an address is reserved or named in SRM.
              {% endif %}
          - type: markdown
            title: Reservations
            content: |
              {#- Names come from the devices themselves: escape what Markdown would read as a table, link or image. -#}
              {%- macro md(v) -%}{{ (v ~ '') | replace('\r', ' ') | replace('\n', ' ') | replace('\\', '\\\\') | replace('|', '\\|') | replace('[', '\\[') | replace(']', '\\]') | replace('!', '\\!') | replace('<', '&lt;') | replace('>', '&gt;') | replace('`', '\\`') | replace('*', '\\*') | replace('_', '\\_') }}{%- endmacro -%}
              {% set s = states.sensor | selectattr('entity_id', 'in', integration_entities('synology_srm_router'))
                 | selectattr('attributes.reservations', 'defined') | first %}
              {% set rows = s.attributes.reservations if s else [] %}
              {% set stale = rows | selectattr('stale') | list %}
              **{{ rows | count }} reservations** · {{ rows | selectattr('online') | list | count }} of their devices online

              {% if stale -%}
              Not online, and not seen by Home Assistant in the last 30 days: candidates to remove.

              | Device | IP | Last seen |
              |---|---|---|
              {% for r in stale -%}
              | {{ md(r.name or r.mac) }} | {{ md(r.ip) }} | {{ r.last_seen or 'not since Home Assistant tracks' }} |
              {% endfor %}
              {%- else -%}
              Every reserved device was seen in the last 30 days.
              {%- endif %}
  - title: DHCP
    path: dhcp
    icon: mdi:lan-connect
    type: panel
    cards:
      - type: markdown
        title: Who has an address
        content: |
          {#- Names come from the devices themselves: escape what Markdown would read as a table, link or image. -#}
          {%- macro md(v) -%}{{ (v ~ '') | replace('\r', ' ') | replace('\n', ' ') | replace('\\', '\\\\') | replace('|', '\\|') | replace('[', '\\[') | replace(']', '\\]') | replace('!', '\\!') | replace('<', '&lt;') | replace('>', '&gt;') | replace('`', '\\`') | replace('*', '\\*') | replace('_', '\\_') }}{%- endmacro -%}
          {% set s = states.sensor | selectattr('entity_id', 'in', integration_entities('synology_srm_router'))
             | selectattr('attributes.leases', 'defined') | first %}
          {% set rows = s.attributes.leases if s else [] %}
          **{{ rows | count }} addresses handed out** · {{ rows | selectattr('online') | list | count }} online · {{ rows | selectattr('reserved') | list | count }} reserved

          | | Device | IP | |
          |:-:|---|---|---|
          {% for r in rows -%}
          | {{ '●' if r.online else '○' }} | {{ md(r.name or r.mac) }} | {{ md(r.ip) }} | {{ 'reserved' if r.reserved else ('**unknown**' if r.unknown else 'expires in ' ~ ((r.expires_in_min // 60) ~ ' h' if r.expires_in_min >= 60 else r.expires_in_min ~ ' min') if r.expires_in_min is not none else '') }} |
          {% endfor %}
  - title: Firewall
    path: firewall
    icon: mdi:wall-fire
    type: panel
    cards:
      - type: vertical-stack
        cards:
          - type: markdown
            title: Last router change
            content: |
              {#- Names come from the devices themselves: escape what Markdown would read as a table, link or image. -#}
              {%- macro md(v) -%}{{ (v ~ '') | replace('\r', ' ') | replace('\n', ' ') | replace('\\', '\\\\') | replace('|', '\\|') | replace('[', '\\[') | replace(']', '\\]') | replace('!', '\\!') | replace('<', '&lt;') | replace('>', '&gt;') | replace('`', '\\`') | replace('*', '\\*') | replace('_', '\\_') }}{%- endmacro -%}
              {% set ns = namespace(found=false) %}
              {% for id in integration_entities('synology_srm_router') if id.startswith('event.') and 'firewall_changed' in (state_attr(id, 'event_types') or []) -%}
              {% set ns.found = true %}{% set a = states[id].attributes %}{% set device = device_id(id) %}
              **{{ md(device_attr(device, 'name_by_user') or device_attr(device, 'name')) }}** · {{ 'no change seen yet' if states(id) in ['unknown', 'unavailable'] else (states(id) | as_datetime | as_local).strftime('%Y-%m-%d %H:%M') }}<br>
              {% if a.event_type == 'prefix_changed' -%}
              {% for c in a.changes %}IPv6 prefix {{ md(c.network) }}: {{ c.prefix or 'none' }} (was {{ c.previous or 'none' }})<br>{% endfor %}
              {%- elif a.event_type == 'firewall_changed' -%}
              {{ ('added: ' ~ md(a.added | join(', ')) ~ '<br>') if a.added }}{{ ('removed: ' ~ md(a.removed | join(', ')) ~ '<br>') if a.removed }}{{ ('switched on: ' ~ md(a.enabled | join(', ')) ~ '<br>') if a.enabled }}{{ ('switched off: ' ~ md(a.disabled | join(', ')) ~ '<br>') if a.disabled }}{{ 'order changed<br>' if a.reordered }}{% for p in a.policy %}default policy {{ p.traffic }}: {{ p.policy }} (was {{ p.previous }})<br>{% endfor %}
              {%- endif %}

              {% endfor %}
              {{ 'No router with router events.' if not ns.found }}
          - type: conditional
            conditions:
              - condition: screen
                media_query: "(min-width: 900px)"
            card:
              type: markdown
              title: Firewall rules
              content: |
                {#- Names come from the devices themselves: escape what Markdown would read as a table, link or image. -#}
                {%- macro md(v) -%}{{ (v ~ '') | replace('\r', ' ') | replace('\n', ' ') | replace('\\', '\\\\') | replace('|', '\\|') | replace('[', '\\[') | replace(']', '\\]') | replace('!', '\\!') | replace('<', '&lt;') | replace('>', '&gt;') | replace('`', '\\`') | replace('*', '\\*') | replace('_', '\\_') }}{%- endmacro -%}
                {% set s = states.sensor | selectattr('entity_id', 'in', integration_entities('synology_srm_router'))
                   | selectattr('attributes.rules', 'defined') | first %}
                {% set rows = s.attributes.rules if s else [] %}
                {% set to = {'input': 'router', 'forward': 'through', 'both_input_forward': 'router + through'} %}
                | Rule | From → to | Ports | Hits |
                |---|---|---|--:|
                {% for r in rows -%}
                | {{ '✅' if r.action == 'allow' else '⛔' }} {{ ('~~' ~ md(r.label) ~ '~~') if r.enabled == false else md(r.label) }} | {{ (r.in_interfaces | join(', ') ~ ': ') if r.in_interfaces }}{{ md(r.source_label or 'any') }} → {{ to.get(r.chain, r.chain) }}{{ (' ' ~ r.out_interfaces | join(', ')) if r.out_interfaces }}{{ (': ' ~ md(r.destination_label)) if r.destination_label }} | {{ md((r.ports or 'all') | replace(',', ', ') | truncate(32)) }} | {{ r.hits if r.hits is not none else '–' }}{{ '<br>⚠ duplicate' if r.duplicate }}{{ '<br>never hit' if r.enabled and r.hits == 0 and not r.duplicate }} |
                {% endfor %}

                ✅ allow · ⛔ deny · ~~struck through~~: switched off · ⚠ duplicate: the same rule earlier in the list matches first · *router*: to the router itself, *through*: through it to another network. Hits count since SRM last built its firewall (after a change or a restart).
          - type: conditional
            conditions:
              - condition: screen
                media_query: "(max-width: 899px)"
            card:
              type: markdown
              title: Firewall rules
              content: |
                {#- Names come from the devices themselves: escape what Markdown would read as a table, link or image. -#}
                {%- macro md(v) -%}{{ (v ~ '') | replace('\r', ' ') | replace('\n', ' ') | replace('\\', '\\\\') | replace('|', '\\|') | replace('[', '\\[') | replace(']', '\\]') | replace('!', '\\!') | replace('<', '&lt;') | replace('>', '&gt;') | replace('`', '\\`') | replace('*', '\\*') | replace('_', '\\_') }}{%- endmacro -%}
                {% set s = states.sensor | selectattr('entity_id', 'in', integration_entities('synology_srm_router'))
                   | selectattr('attributes.rules', 'defined') | first %}
                {% set rows = s.attributes.rules if s else [] %}
                {% set to = {'input': 'router', 'forward': 'through', 'both_input_forward': 'router + through'} %}
                {% for r in rows -%}
                {{ '✅' if r.action == 'allow' else '⛔' }} **{{ ('~~' ~ md(r.label) ~ '~~') if r.enabled == false else md(r.label) }}** · {{ r.hits if r.hits is not none else '–' }} hits{{ ' · ⚠ duplicate' if r.duplicate }}{{ ' · never hit' if r.enabled and r.hits == 0 and not r.duplicate }}<br>
                {{ (r.in_interfaces | join(', ') ~ ': ') if r.in_interfaces }}{{ md(r.source_name or 'any') }} → {{ to.get(r.chain, r.chain) }}{{ (' ' ~ r.out_interfaces | join(', ')) if r.out_interfaces }}{{ (': ' ~ md(r.destination_name)) if r.destination_name }}{{ (' · ports ' ~ md(r.ports | replace(',', ', ') | truncate(32))) if r.ports }}

                {% endfor %}
                ✅ allow · ⛔ deny · *router*: to the router itself, *through*: through it to another network.
