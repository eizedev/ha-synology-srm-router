[project]
site_name = "Synology SRM Router"
site_description = "Home Assistant integration for Synology routers and access points (SRM): load, traffic, WAN and device trackers"
site_url = "https://ha-synology-srm-router.eize.dev/"
repo_url = "https://github.com/eizedev/ha-synology-srm-router"
repo_name = "eizedev/ha-synology-srm-router"
edit_uri = "edit/main/docs/"
copyright = "MIT licensed · Unofficial, not affiliated with Synology Inc."
extra_css = ["assets/site.css"]
nav = [
  { "Overview" = "index.md" },
  { "Installation" = "installation.md" },
  { "Configuration" = "configuration.md" },
  { "Entities" = "entities.md" },
  { "Events" = "events.md" },
  { "Dashboards" = "dashboards.md" },
  { "Ideas and automations" = "ideas.md" },
  { "Troubleshooting" = "troubleshooting.md" },
  { "Repairs" = [{ "Device blocks Home Assistant" = "repairs/blocked.md" }, { "Managed from the internet" = "repairs/srm-from-internet.md" }, { "Auto block is off" = "repairs/auto-block-off.md" }, { "Firewall lets the internet in" = "repairs/firewall-open.md" }] },
]

[project.theme]
language = "en"
logo = "assets/icon.svg"
favicon = "assets/icon.svg"
# Fonts come from the system; nothing is loaded from Google.
font = false
features = [
  "content.action.edit",
  "content.code.copy",
  "navigation.footer",
  "navigation.instant",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/moon"
toggle.name = "Dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/sun"
toggle.name = "Light mode"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.highlight = {}
pymdownx.superfences = {}
pymdownx.inlinehilite = {}
pymdownx.snippets = { check_paths = true }
